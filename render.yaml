services:
  - type: web
    name: licensed-resource-search-free
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/start-free.mjs
    healthCheckPath: /health/live
    envVars:
      - fromGroup: licensed-resource-search-free-secrets
      - key: APP_ENV
        value: production
      - key: APP_URL
        fromService:
          type: web
          name: licensed-resource-search-free
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: licensed-resource-search-free-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: licensed-resource-search-free-redis
          property: connectionString
      - key: MEILI_HOST
        value: http://127.0.0.1:7700
      - key: NEXT_PUBLIC_APP_NAME
        value: 授权资料搜索
      - key: EVIDENCE_STORAGE_DRIVER
        value: local_private
      - key: LOCAL_EVIDENCE_ROOT
        value: evidence-storage
      - key: REGION_STATS_ENABLED
        value: 'false'
      - key: TRUSTED_PROXY_HOPS
        value: '1'
      - key: LOG_LEVEL
        value: info
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: ''
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: licensed-resource-search-free-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: licensed-resource-search-free-db
    plan: free
    region: singapore
    postgresMajorVersion: '18'
    databaseName: licensed_resource_search
    user: licensed_resource_search
    ipAllowList: []

envVarGroups:
  - name: licensed-resource-search-free-secrets
    envVars:
      - key: MEILI_MASTER_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: URL_HASH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
