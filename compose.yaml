name: licensed-resource-search

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-licensed_resource_search}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:8.2.7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:-dev-only-change-me}',
        '--appendonly',
        'yes',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-dev-only-change-me}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  meilisearch:
    image: getmeili/meilisearch:v1.37.0
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-only-meilisearch-master-key-change-me}
      MEILI_NO_ANALYTICS: 'true'
    command:
      [
        'meilisearch',
        '--master-key',
        '${MEILI_MASTER_KEY:-dev-only-meilisearch-master-key-change-me}',
      ]
    ports:
      - '127.0.0.1:${MEILI_PORT:-7700}:7700'
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:7700/health >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:

networks:
  internal:
    driver: bridge
